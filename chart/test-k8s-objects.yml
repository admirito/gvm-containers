---
apiVersion: v1
kind: Namespace
metadata:
  name: gvm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-claim
  namespace: gvm
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: csi-cephfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gvmd-db-claim
  namespace: gvm
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: csi-cephfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openvas-redis-claim
  namespace: gvm
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: csi-cephfs
